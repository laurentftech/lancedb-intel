name: Publish macOS Intel LanceDB build

on:
  workflow_dispatch:
    inputs:
      lancedb_version:
        description: Exact @lancedb/lancedb npm version to build (for example, 0.40.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    # This job only runs on the explicitly configured Intel Mac runner.
    # There is deliberately no GitHub-hosted fallback.
    runs-on: [self-hosted, macOS, X64, lancedb-intel]
    timeout-minutes: 240
    steps:
      - name: Check out recipes
        uses: actions/checkout@v4

      - name: Build and smoke-test LanceDB for Intel
        env:
          LANCEDB_VERSION: ${{ inputs.lancedb_version }}
        run: ./lancedb-intel build --version "$LANCEDB_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run official Node.js test suite against Intel module
        shell: bash
        env:
          LANCEDB_VERSION: ${{ inputs.lancedb_version }}
        run: |
          set -euo pipefail
          build_dir="$HOME/.local/share/lancedb-intel/builds/$LANCEDB_VERSION"
          source_dir="$build_dir/source"
          sdk_dir="$build_dir/smoke-test-sdk/node_modules/@lancedb/lancedb"
          export NAPI_RS_NATIVE_LIBRARY_PATH="$build_dir/lancedb.darwin-x64.node"
          test -s "$NAPI_RS_NATIVE_LIBRARY_PATH"
          test -s "$sdk_dir/dist/native.js"
          test -s "$sdk_dir/dist/native.d.ts"
          cd "$source_dir/nodejs"
          test ! -e lancedb/native.js
          test ! -e lancedb/native.d.ts
          ln -s "$sdk_dir/dist/native.js" lancedb/native.js
          ln -s "$sdk_dir/dist/native.d.ts" lancedb/native.d.ts
          cleanup() {
            rm -f lancedb/native.js lancedb/native.d.ts
          }
          trap cleanup EXIT
          pnpm install --frozen-lockfile
          pnpm tsc
          pnpm test --runInBand

      - name: Prepare release assets
        id: assets
        shell: bash
        env:
          LANCEDB_VERSION: ${{ inputs.lancedb_version }}
        run: |
          set -euo pipefail
          build_dir="$HOME/.local/share/lancedb-intel/builds/$LANCEDB_VERSION"
          test -s "$build_dir/lancedb.darwin-x64.node"
          test -s "$build_dir/build-info.json"
          shasum -a 256 "$build_dir/lancedb.darwin-x64.node" > "$build_dir/SHA256SUMS"
          echo "dir=$build_dir" >> "$GITHUB_OUTPUT"
          echo "tag=v$LANCEDB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Attest native module
        # GitHub Free/Pro/Team supports attestations for public repositories.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.assets.outputs.dir }}/lancedb.darwin-x64.node

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LANCEDB_VERSION: ${{ inputs.lancedb_version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.assets.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "LanceDB $LANCEDB_VERSION · macOS Intel" \
            --notes "Official LanceDB source build for x86_64-apple-darwin. Built on the repository's self-hosted Intel Mac runner, passed the official Node.js test suite, and passed the isolated SDK smoke test. See build-info.json for source commit and toolchain details."
          gh release upload "$tag" \
            "${{ steps.assets.outputs.dir }}/lancedb.darwin-x64.node" \
            "${{ steps.assets.outputs.dir }}/build-info.json" \
            "${{ steps.assets.outputs.dir }}/SHA256SUMS" \
            --clobber
